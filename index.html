<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Night</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;500;700;800&display=swap');

  :root{
    --stage-navy: #0B1E3D;
    --stage-navy-deep: #071531;
    --board-blue: #1F3B73;
    --board-blue-light: #2A4E96;
    --marquee-gold: #F2B705;
    --marquee-gold-dim: #C99A04;
    --spark-white: #F5F7FA;
    --muted: #9FB1D6;
    --correct-green: #2FA84F;
    --wrong-red: #D64545;
    --ink: #101623;
    --panel: #12274F;
    --radius: 10px;
    --font-display: 'Archivo Black', 'Arial Black', sans-serif;
    --font-body: 'Manrope', system-ui, sans-serif;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: radial-gradient(ellipse at top, var(--stage-navy) 0%, var(--stage-navy-deep) 70%);
    color: var(--spark-white);
    font-family: var(--font-body);
    min-height: 100vh;
  }
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  button{
    font-family: var(--font-body);
    cursor:pointer;
    border:none;
  }
  input{
    font-family: var(--font-body);
  }
  a{ color: var(--marquee-gold); }

  /* ---------- Landing ---------- */
  .landing{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; gap:28px;
  }
  .marquee-title{
    font-family: var(--font-display);
    font-size: clamp(32px, 7vw, 56px);
    letter-spacing: 0.5px;
    color: var(--marquee-gold);
    text-shadow: 0 0 18px rgba(242,183,5,0.35);
    margin:0;
  }
  .marquee-sub{ color: var(--muted); font-size:16px; margin-top:-14px; }
  .role-buttons{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .big-btn{
    background: var(--marquee-gold);
    color: var(--ink);
    font-weight:800;
    font-size:17px;
    padding:18px 30px;
    border-radius: var(--radius);
    min-width:210px;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 4px 0 var(--marquee-gold-dim);
  }
  .big-btn:active{ transform: translateY(3px); box-shadow: 0 1px 0 var(--marquee-gold-dim); }
  .big-btn.secondary{
    background: transparent;
    color: var(--spark-white);
    border: 2px solid var(--board-blue-light);
    box-shadow:none;
  }
  .big-btn.secondary:active{ transform: translateY(1px); }
  .big-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- Forms / panels ---------- */
  .panel{
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 26px;
    max-width: 440px;
    width:100%;
  }
  .field{ text-align:left; margin-bottom:16px; }
  .field label{ display:block; font-size:13px; color: var(--muted); margin-bottom:6px; font-weight:700; }
  .field input, .field select{
    width:100%; padding:12px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: var(--spark-white); font-size:16px;
  }
  .field input::placeholder{ color: rgba(255,255,255,0.35); }
  .error-text{ color:#FF9C9C; font-size:14px; margin-top:8px; }
  .hint-text{ color: var(--muted); font-size:13px; margin-top:6px; }

  .team-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:18px; }
  .team-pick{
    padding:14px 10px; border-radius:10px; border:2px solid transparent;
    background: rgba(255,255,255,0.06); color: var(--spark-white); font-weight:700; font-size:14px;
  }
  .team-pick.selected{ border-color: var(--marquee-gold); background: rgba(242,183,5,0.15); }
  .team-pick.no-team{ grid-column: span 2; background: rgba(255,255,255,0.03); }

  /* ---------- Host: top bar ---------- */
  .host-topbar{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    padding:14px 22px; background: rgba(0,0,0,0.25); flex-wrap:wrap;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .room-chip{
    display:flex; align-items:center; gap:10px; background: rgba(242,183,5,0.12);
    border:1px solid rgba(242,183,5,0.4); border-radius:10px; padding:8px 14px;
  }
  .room-chip .code{ font-family: var(--font-display); font-size:22px; letter-spacing:3px; color: var(--marquee-gold); }
  .room-chip .label{ font-size:11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .topbar-controls{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }

  .toggle-row{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .toggle{
    width:46px; height:26px; border-radius:20px; background: rgba(255,255,255,0.15);
    position:relative; transition: background .15s ease;
  }
  .toggle.on{ background: var(--marquee-gold); }
  .toggle .knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background: var(--spark-white); transition: left .15s ease;
  }
  .toggle.on .knob{ left:23px; }

  .small-btn{
    background: rgba(255,255,255,0.08); color: var(--spark-white); font-size:13px; font-weight:700;
    padding:9px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
  }
  .small-btn:hover{ background: rgba(255,255,255,0.14); }
  .small-btn.danger{ background: rgba(214,69,69,0.18); border-color: rgba(214,69,69,0.4); color:#FFB3B3; }

  /* ---------- Scoreboard strip ---------- */
  .scoreboard{ display:flex; gap:10px; padding:12px 22px; flex-wrap:wrap; }
  .team-pill{
    display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:24px;
    background: rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  }
  .team-dot{ width:10px; height:10px; border-radius:50%; }
  .team-pill .tname{ font-size:13px; font-weight:700; }
  .team-pill .tscore{ font-family: var(--font-display); font-size:15px; color: var(--marquee-gold); }
  .team-pill input{ background:transparent; border:none; color:var(--spark-white); font-weight:700; font-size:13px; width:90px; }

  /* ---------- Board ---------- */
  .board-wrap{ flex:1; padding: 18px 22px 30px; display:flex; flex-direction:column; }
  .board{
    display:grid; grid-template-columns: repeat(6, 1fr); gap:8px; flex:1;
  }
  .cat-header{
    background: var(--board-blue); border-radius:8px; padding:14px 8px; text-align:center;
    font-family: var(--font-display); font-size: clamp(11px,1.4vw,15px); letter-spacing:0.5px;
    display:flex; align-items:center; justify-content:center; min-height:64px; line-height:1.25;
  }
  .clue-tile{
    background: linear-gradient(180deg, var(--board-blue-light), var(--board-blue));
    border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-family: var(--font-display); font-size: clamp(18px,2.4vw,28px); color: var(--marquee-gold);
    min-height:72px; transition: transform .1s ease, filter .1s ease;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .clue-tile:hover{ transform: translateY(-2px); filter:brightness(1.12); }
  .clue-tile.used{
    background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.15); cursor:default;
    box-shadow:none;
  }
  .clue-tile.used:hover{ transform:none; filter:none; }

  /* ---------- Clue overlay ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(4,10,25,0.94); z-index:50;
    display:flex; flex-direction:column;
  }
  .overlay-top{ display:flex; justify-content:space-between; align-items:center; padding:16px 22px; }
  .overlay-cat{ color: var(--muted); font-size:14px; text-transform:uppercase; letter-spacing:1px; }
  .overlay-value{ font-family: var(--font-display); color: var(--marquee-gold); font-size:20px; }
  .overlay-body{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:22px; overflow-y:auto; }
  .clue-text{ font-size: clamp(20px,3.4vw,34px); text-align:center; max-width:900px; line-height:1.35; font-weight:700; white-space:pre-line; transition: font-size .2s ease, opacity .2s ease; }
  .clue-text:has(~ .answer-reveal){ font-size: clamp(14px,2vw,20px); opacity:0.7; }
  .clue-media img, .clue-media video{ max-width:min(640px,90vw); max-height:42vh; border-radius:10px; box-shadow:0 8px 30px rgba(0,0,0,0.5); }
  .answer-reveal{ font-size: clamp(28px,4.5vw,44px); color: var(--correct-green); font-weight:800; text-align:center; white-space:pre-line; }

  .overlay-controls{ padding:18px 22px 28px; display:flex; flex-direction:column; gap:16px; align-items:center; }
  .control-row{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }

  .buzz-feed, .answer-feed{
    width:100%; max-width:640px; display:flex; flex-direction:column; gap:8px;
    max-height:220px; overflow-y:auto; padding-right:4px;
  }
  .feed-empty{ color: var(--muted); text-align:center; font-size:14px; padding:14px; }
  .feed-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background: rgba(255,255,255,0.05); border-radius:8px; padding:10px 14px;
  }
  .feed-row.locked{ opacity:0.4; }
  .feed-rank{ font-family: var(--font-display); color: var(--marquee-gold); width:26px; }
  .feed-name{ flex:1; font-weight:700; font-size:14px; }
  .feed-team{ font-size:11px; color: var(--muted); text-transform:uppercase; }
  .feed-answer-text{ flex:2; font-size:14px; color: var(--spark-white); }
  .feed-actions{ display:flex; gap:6px; }
  .mini-btn{ padding:6px 10px; border-radius:6px; font-size:12px; font-weight:700; }
  .mini-btn.correct{ background: var(--correct-green); color:#fff; }
  .mini-btn.wrong{ background: var(--wrong-red); color:#fff; }

  /* ---------- Player view ---------- */
  .player-wrap{ flex:1; display:flex; flex-direction:column; }
  .player-status-bar{
    padding:14px 20px; background: rgba(0,0,0,0.25); display:flex; justify-content:space-between;
    align-items:center; border-bottom:1px solid rgba(255,255,255,0.08); font-size:13px; color:var(--muted);
  }
  .player-main{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; gap:22px; text-align:center; }
  .waiting-pulse{ font-family: var(--font-display); font-size:20px; color: var(--muted); letter-spacing:1px; }

  .buzzer-btn{
    width: min(260px, 60vw); height: min(260px, 60vw); border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #FF5C5C, #C21818);
    color:#fff; font-family: var(--font-display); font-size:28px; letter-spacing:1px;
    box-shadow: 0 10px 0 #7A0E0E, 0 14px 30px rgba(0,0,0,0.5);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .buzzer-btn:active{ transform: translateY(8px); box-shadow: 0 2px 0 #7A0E0E, 0 6px 16px rgba(0,0,0,0.5); }
  .buzzer-btn:disabled{
    background: radial-gradient(circle at 35% 30%, #4a4a4a, #2b2b2b);
    box-shadow: 0 10px 0 #1a1a1a; color: rgba(255,255,255,0.5); cursor:not-allowed;
  }
  .buzz-rank-msg{ font-size:18px; font-weight:800; color: var(--marquee-gold); }

  .answer-box{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:12px; }
  .answer-box textarea{
    width:100%; min-height:90px; border-radius:10px; padding:14px; font-size:16px;
    border:1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06); color:var(--spark-white); resize:vertical;
  }

  .roster-strip{ padding:14px 20px; }
  .roster-groups{ display:flex; gap:16px; flex-wrap:wrap; }
  .roster-drawer{
    position: fixed; top:0; right:0; height:100vh; width:300px; max-width:85vw;
    background: var(--panel); border-left:1px solid rgba(255,255,255,0.08);
    padding:20px; overflow-y:auto; transform: translateX(100%); transition: transform .22s ease;
    z-index:60; box-shadow: -10px 0 26px rgba(0,0,0,0.4);
  }
  .roster-drawer.open{ transform: translateX(0); }
  .roster-drawer-header{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:18px; }
  .roster-drawer-header h3{ margin:0; font-family: var(--font-body); font-weight:800; font-size:14px; color: var(--muted); }

  /* ---------- Settings drawer (slides in from the left) ---------- */
  .settings-drawer{
    left:0; right:auto; width:340px;
    border-left:none; border-right:1px solid rgba(255,255,255,0.08);
    transform: translateX(-100%); box-shadow: 10px 0 26px rgba(0,0,0,0.4);
  }
  .settings-drawer h3{ color: var(--spark-white); font-size:18px; }
  .setting{ padding:16px 0; border-bottom:1px solid rgba(255,255,255,0.08); }
  .setting:last-child{ border-bottom:none; }
  .setting-head{ display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .setting-title{ font-weight:800; font-size:14px; }
  .setting-desc{ font-size:12px; color: var(--muted); margin-top:6px; line-height:1.45; }
  .setting .toggle-row{ font-size:12px; }
  .setting-input{
    width:80px; padding:8px 10px; border-radius:8px; border:1px solid rgba(255,255,255,0.15);
    background: rgba(255,255,255,0.06); color: var(--spark-white); font-size:15px; font-weight:700;
  }
  .setting-input:disabled{ opacity:0.4; }
  .status-line{ font-size:12px; color: var(--muted); }
  .btn-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .file-chip{ margin-top:10px; font-size:13px; font-weight:700; word-break:break-word; }
  .warn-text{ font-size:12px; color:#F7CF5C; margin-top:8px; line-height:1.45; }
  .err-text{ font-size:12px; color:#FF9C9C; margin-top:8px; line-height:1.45; }
  .vol-slider{ flex:1; accent-color: var(--marquee-gold); }
  .preview-box{
    margin-top:12px; padding:12px; border-radius:10px;
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  }
  .preview-box ul{ margin:8px 0 0; padding-left:18px; font-size:12px; line-height:1.6; }
  .small-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .pick-banner{
    margin: 12px 22px 0; padding:12px 16px; border-radius:10px;
    background: rgba(242,183,5,0.12); border:1px solid rgba(242,183,5,0.4);
    display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:14px;
  }

  /* ---------- Answer timer ---------- */
  .timer-display{ width:100%; max-width:420px; text-align:center; }
  .timer-label{ font-size:13px; color: var(--muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
  .timer-count{ font-family: var(--font-display); font-size: clamp(36px,7vw,56px); color: var(--marquee-gold); line-height:1; }
  .timer-bar{ height:8px; border-radius:6px; background: rgba(255,255,255,0.1); margin-top:10px; overflow:hidden; }
  .timer-fill{ height:100%; background: var(--marquee-gold); border-radius:6px; transition: width .2s linear; }
  .timer-display.low .timer-count{ color: var(--wrong-red); }
  .timer-display.low .timer-fill{ background: var(--wrong-red); }
  .timer-display.expired .timer-count{ color: var(--wrong-red); font-size: clamp(28px,5vw,40px); }

  .correct-by{ font-size:16px; font-weight:700; color: var(--spark-white); text-align:center; }
  .judged-badge{ font-size:12px; font-weight:800; padding:4px 10px; border-radius:6px; }
  .judged-badge.correct{ background: rgba(47,168,79,0.2); color:#8EE6A6; }
  .judged-badge.wrong{ background: rgba(214,69,69,0.2); color:#FFB3B3; }
  .unlock-btn{ min-width:240px; }
  .roster-group{ min-width:140px; }
  .roster-group h4{ margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); }
  .roster-group ul{ list-style:none; margin:0; padding:0; font-size:13px; }
  .roster-group li{ padding:2px 0; }

  /* Read-only board for players & spectators */
  .board.readonly .clue-tile{ cursor:default; }
  .board.readonly .clue-tile:hover{ transform:none; filter:none; }
  .board-waiting{ text-align:center; color: var(--muted); font-size:14px; margin-bottom:12px; }

  /* Phones: keep all 6 columns lined up (just smaller) so categories stay above their own amounts */
  @media (max-width:720px){
    .board-wrap{ padding: 12px 8px 20px; }
    .board{ gap:4px; }
    .cat-header{ font-size:9px; padding:6px 3px; min-height:46px; letter-spacing:0; word-break:break-word; }
    .clue-tile{ font-size:13px; min-height:44px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
/* ============================================================
   DATA: placeholder board content — swap in real clues later
   ============================================================ */
const PLACEHOLDER_IMG = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360">' +
  '<rect width="640" height="360" fill="#2A4E96"/>' +
  '<text x="320" y="190" font-family="Arial" font-size="34" fill="#F2B705" text-anchor="middle">IMAGE CLUE GOES HERE</text>' +
  '</svg>'
);

function makeClue(id, value, clue, answer, media){
  return { id, value, clue, answer, media: media || null };
}

const DEFAULT_CATEGORIES = [
  { id:'promably', name:'Prom-ably Famous', clues:[
      makeClue('promably_200', 200, `In this Stephen King novel, the protagonist's prom night takes a horrific turn after her classmates dump pig's blood on her.`, `What is Carrie?`),
      makeClue('promably_400', 400, `In this 1984 film, Ren McCormack fights his town's ban on dancing so the high-school students can hold a senior prom.`, `What is Footloose?`),
      makeClue('promably_600', 600, `Six years after a girl's accidental death, a masked killer begins targeting the four people who kept it secret in this 1980 horror film.`, `What is Prom Night?`),
      makeClue('promably_800', 800, `In the 1986 movie Pretty in Pink, this character creates her own distinctive pink prom dress.`, `Who is Andie Walsh?`),
      makeClue('promably_1000', 1000, `In She's All That, this popular student accepts a bet that he can turn Laney Boggs into the school's prom queen in six weeks.`, `Who is Zack Siler?`),
  ]},
  { id:'sceneofcrime', name:'Scene of the Crime', clues:[
      makeClue('sceneofcrime_200', 200, `Name the song that plays during this scene.`, `What is "Hey Ho" by The Lumineers?`, {type:'video', url:'media/Haley%20Arrival.mp4'}),
      makeClue('sceneofcrime_400', 400, `Name the song that plays during this scene.`, `What is "Have Yourself a Merry Little Christmas" by Digital Daggers?`, {type:'video', url:'media/Carol%20Death.mp4'}),
      makeClue('sceneofcrime_600', 600, `Name the song that plays during this scene.`, `What is "Kiss Me" by Ed Sheeran?`, {type:'video', url:'media/Sire%20Bond.mp4'}),
      makeClue('sceneofcrime_800', 800, `Name the song that plays during this scene.`, `What is "I Love It" by Icona Pop?`, {type:'video', url:'media/Elena%20Party.mp4'}),
      makeClue('sceneofcrime_1000', 1000, `Name the song that plays during this scene.`, `What is "Sail" by AWOLNATION?`, {type:'video', url:'media/Elena%20Training.mp4'}),
  ]},
  { id:'mysticmelodies', name:'Mystic Melodies', clues:[
      makeClue('mysticmelodies_200', 200, `"Feel So Close" by Calvin Harris`, `Any of: Murder House party; Damon and Elena dancing at the frat party; Damon and Elena feeding on people at the frat party; Damon and Elena dirty dancing at the Whitmore party; Whitmore frat party`),
      makeClue('mysticmelodies_400', 400, `"Oh Holy Night" by Cary Brothers`, `Any of: Klaus killing the hybrids; Klaus massacring his hybrids; Klaus killing the hybrids at the Christmas party; Tyler and Hayley talking while Klaus kills the hybrids`),
      makeClue('mysticmelodies_600', 600, `"Psycho Killer" by Talking Heads`, `Any of: Damon's 1977 New York flashback; Damon feeding on a couple in New York; Damon killing/feeding on people in 1970s New York; Damon and Elena walking through present-day New York; Damon and Elena in New York`),
      makeClue('mysticmelodies_800', 800, `"Stay" by Rihanna feat. Mikky Ekko`, `Any of: the 1990s-themed prom; Bonnie and Jeremy dancing at prom; Stefan and Elena dancing at prom; Rebekah and Matt talking/dancing at prom; the Mystic Falls High prom`),
      makeClue('mysticmelodies_1000', 1000, `"You Give Love a Bad Name" by Bon Jovi`, `Any of: Stefan and Lexi drinking and dancing at the Salvatore mansion; Stefan and Lexi celebrating together; Stefan and Lexi partying at the beginning of the episode; Lexi celebrating Stefan's graduation with him`),
  ]},
  { id:'promposal', name:'Promposal', clues:[
      makeClue('promposal_200', 200, `These two actors dated during the show's first three seasons, but by the time their characters finally became an official couple on-screen, their real-life relationship had already come to an end.`, `Who are Nina Dobrev and Ian Somerhalder?`),
      makeClue('promposal_400', 400, `These two actors' TVD characters never had a romantic storyline together, but had they been paired up, their relationship could have been described as the classic "best friend's brother" trope.`, `Who are Steven McQueen and Candice King?`),
      makeClue('promposal_600', 600, `Their first real-life interaction was brief and happened in a hallway on set. For one of these actors, however, that quick encounter was enough to make an immediate impression — and she developed a crush on her future husband.`, `Who are Joseph Morgan and Persia White?`),
      makeClue('promposal_800', 800, `On-screen, one of these actors' characters developed a reputation for dating nearly everyone in Mystic Falls; off-screen, the other actor became romantically linked to several of his fellow TVD castmates. Bonus clue: both actors are naturally blonde.`, `Who are Candice King and Zach Roerig?`),

/* ============================================================
   SOUND EFFECTS (synthesized — no external audio files)
   ============================================================ */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
  }
  return audioCtx;
}
function playTone(freq, duration, type, vol, delay){
  if(App.playerMuted && (App.view === 'player-play' || App.view === 'player-join')) return;
  const ctx = getCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol || 0.2;
    osc.connect(gain); gain.connect(ctx.destination);
    const t0 = ctx.currentTime + (delay || 0);
    osc.start(t0);
    gain.gain.setValueAtTime(vol || 0.2, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.stop(t0 + duration + 0.02);
  }catch(e){}
}
function sfxBuzz(){ playTone(880,0.12,'square',0.25,0); playTone(440,0.15,'square',0.2,0.05); }
function sfxCorrect(){ playTone(523.25,0.12,'sine',0.22,0); playTone(659.25,0.12,'sine',0.22,0.12); playTone(783.99,0.2,'sine',0.22,0.24); }
// Host -> players: "play this sound now" (buzz-in, correct, wrong).
function broadcastSfx(name){
  if(App.view !== 'host-board') return;
  Object.keys(App.connections).forEach(pid => {
    const c = App.connections[pid];
    if(c.conn && c.conn.open) c.conn.send({ type: 'sfx', name });
  });
}
function sfxWrong(){ playTone(220,0.3,'sawtooth',0.22,0); playTone(160,0.35,'sawtooth',0.18,0.08); }
function sfxSubmit(){ playTone(660,0.08,'sine',0.15,0); }
function sfxJoin(){ playTone(494,0.1,'sine',0.18,0); playTone(659,0.12,'sine',0.18,0.1); }
function sfxUnlock(){ playTone(784,0.1,'sine',0.2,0); playTone(1046.5,0.16,'sine',0.2,0.1); }
function sfxTimeUp(){ playTone(330,0.18,'square',0.2,0); playTone(330,0.18,'square',0.2,0.25); playTone(247,0.4,'square',0.2,0.5); }

/* ============================================================
   PEER-TO-PEER NETWORKING (PeerJS — no server of our own needed)
   The host's browser tab IS the server for the duration of the game.
   Room code -> a peer id on PeerJS's free public broker.
   ============================================================ */
const PEER_PREFIX = 'triviabd-';
// Bump this whenever the file changes, so host and players can tell if someone
// is running an old copy (e.g. a tab left open from before an update).
const APP_VERSION = 10;

/* ============================================================
   HOST PASSWORD — change the text between the quotes to set it.
   (This keeps players from clicking "Host a Game". It is not
   hidden from someone who opens View Page Source.)
   ============================================================ */
const HOST_PASSWORD = 'changeme';

/* ============================================================
   APP STATE
   ============================================================ */
function lsGetEarly(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
const App = {
  view: 'landing', // landing | host-login | host-board | player-join | player-play
  hostPwInput: '',
  hostPwError: '',
  roomCode: null,
  peer: null,
  hostConn: null,      // player's connection object to the host
  connections: {},      // host-side: peerId -> { conn, name, teamId, role }
  playerName: '',
  playerTeam: null,
  playerRole: 'player',  // 'player' | 'spectator'
  joinPhase: 'enter-info', // enter-info | connecting | picking
  joinError: '',
  joinRoomInput: '',
  joinNameInput: '',
  state: null,       // shared LIVE game state (host is authoritative)
  categories: null,   // board content, sent along with state
  buzzList: [],        // host-side, current clue, in arrival order
  answerList: [],
  answerDraft: '',
  myBuzzed: false,
  mySubmitted: false,
  rosterPanelOpen: false,        // host-side UI only
  dailyDoubleMode: 'random',      // 'random' | 'manual' — host-only, never broadcast
  dailyDoubleClueIds: [],          // host-only secret list of clue ids flagged as Daily Double
  pickingDailyDouble: false,        // host-only: board clicks mark/unmark DD tiles instead of opening them
  settingsPanelOpen: false,         // host-side UI only
  lockOnOpen: true,                  // host setting: responses start locked until the host unlocks them
  timerEnabled: false,               // host setting: show an answer countdown
  timerSeconds: 10,                  // host setting: countdown length
  timerSecondsInput: '10',           // what's typed in the seconds box (kept separately so a re-render mid-typing doesn't wipe it)
  timerLocalEnd: 0,                  // when the running countdown ends, on THIS device's clock
  timerForPid: null,                 // host-only: which buzzer the running timer belongs to
  judged: {},                         // host-only: pid -> 'correct' | 'wrong' for the current clue
  buzzRoundActive: false,            // host-only: buzzes still accepted (keeps late-but-honest buzzes queued after the first one locks the floor)
  submitGraceUntil: 0,               // host-only: brief grace window for answers sent right as submissions close
  // Timer sound (host only, remembered in this browser)
  timerSound: null,                  // { name, url } of the uploaded sound
  timerSoundSaved: true,             // false if the browser wouldn't let us save it
  timerSoundEnabled: false,
  timerSoundVolume: 0.8,
  soundPreviewing: false,
  soundError: '',
  timerSoundId: null,                // id of the sound being shared with players
  soundChunks: null, soundMime: '', soundAcks: {}, soundQueue: [], soundSending: 0,
  // player side
  playerSound: null,                 // { id, url } of the sound received from the host
  incomingSound: null,               // pieces still arriving
  playingSeq: null,                  // which timer start the player's sound is playing for
  soundBlocked: false,               // phone blocked the sound; show "tap to turn on"
  audioUnlocked: false,
  playerMuted: lsGetEarly('gameNight.playerMuted') === '1',   // player/spectator's own mute button
  // Questions (host only, remembered in this browser)
  savedBoard: null,                  // { fileName, savedAt, categories } from an uploaded spreadsheet
  boardSource: 'builtin',            // 'builtin' | 'upload' — what the current room is using
  boardImport: null,                 // spreadsheet waiting for "Replace board": { fileName, categories, errors, warnings }
  boardImportBusy: false,
};

function genRoomCode(){
  const letters = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
  let s = '';
  for(let i=0;i<4;i++) s += letters[Math.floor(Math.random()*letters.length)];
  return s;
}

function defaultGameState(){
  return {
    teams: [
      { id:'t1', name:'Team 1', color:'#F2B705', score:0 },
      { id:'t2', name:'Team 2', color:'#3DA5D9', score:0 },
      { id:'t3', name:'Team 3', color:'#E4572E', score:0 },
      { id:'t4', name:'Team 4', color:'#9B5DE5', score:0 },
    ],
    allowNoTeam: true,
    mode: 'buzzer', // 'buzzer' | 'type'
    usedClues: [],
    currentCatId: null,
    currentClueId: null,
    buzzOpen: false,
    submitOpen: false,
    revealed: false,
    lockedOut: [],
    buzzOrderSummary: [],
    answerOrderSummary: [],
    isDailyDouble: false,
    ddPhase: null,     // 'select-answerer' | 'wager' | 'clue'
    ddAnswerer: null,   // { type:'team'|'individual', id, label }
    ddWager: null,
    timerRunning: false,
    timerRemainingMs: 0,  // filled in at send time so each device can count down on its own clock
    timerTotalMs: 0,
    timerExpired: false,
    timerFor: '',         // who the clock is for ("Jordan", "Team 2", "Everyone")
    correctNames: [],     // who got the current clue right, shown with the revealed answer
  };
}

function findCategory(catId){ return App.categories.find(c => c.id === catId); }
function findClue(catId, clueId){
  const cat = findCategory(catId);
  if(!cat) return null;
  return cat.clues.find(cl => cl.id === clueId);
}
function currentClue(){
  if(!App.state || !App.state.currentClueId) return null;
  if(App.view === 'host-board') return findClue(App.state.currentCatId, App.state.currentClueId);
  // Players only ever receive the clue that's open, and the answer only once it's revealed.
  const d = App.state.clueData;
  if(d) return { clue: d.clue, media: d.media, value: d.value, answer: App.state.answerData || '' };
  // Older host copies sent the whole board instead — use it if that's what we got.
  const full = findClue(App.state.currentCatId, App.state.currentClueId);
  if(full && typeof full.clue === 'string') return full;
  return null;
}

// What players get for the board: category names and dollar amounts only —
// no clue text or answers ahead of time.
function publicCategories(){
  return App.categories.map(c => ({
    id: c.id, name: c.name,
    clues: c.clues.map(cl => ({ id: cl.id, value: cl.value })),
  }));
}

/* ============================================================
   HOST ACTIONS
   ============================================================ */
function hostCreateRoom(){
  if(App.savedBoard && App.savedBoard.categories && App.savedBoard.categories.length){
    App.categories = App.savedBoard.categories;
    App.boardSource = 'upload';
  } else {
    App.categories = DEFAULT_CATEGORIES;
    App.boardSource = 'builtin';
  }
  App.boardImport = null;
  App.state = defaultGameState();
  App.connections = {};
  App.dailyDoubleMode = 'random';
  App.dailyDoubleClueIds = [];
  App.pickingDailyDouble = false;
  assignRandomDailyDouble();
  tryCreateHostPeer(0);
}

function assignRandomDailyDouble(){
  const allClueIds = [];
  App.categories.forEach(cat => cat.clues.forEach(cl => allClueIds.push(cl.id)));
  if(!allClueIds.length) return;
  App.dailyDoubleClueIds = [ allClueIds[Math.floor(Math.random() * allClueIds.length)] ];
}

function hostToggleDailyDoubleMode(){
  App.dailyDoubleMode = App.dailyDoubleMode === 'random' ? 'manual' : 'random';
  App.pickingDailyDouble = false;
  if(App.dailyDoubleMode === 'random'){
    assignRandomDailyDouble();
  } else {
    App.dailyDoubleClueIds = [];
  }
  render();
}

function tryCreateHostPeer(attempt){
  const code = genRoomCode();
  const peer = new Peer(PEER_PREFIX + code);
  peer.on('open', () => {
    App.roomCode = code;
    App.peer = peer;
    App.view = 'host-board';
    render();
  });
  peer.on('connection', (conn) => setupHostConnection(conn));
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });
  peer.on('error', (err) => {
    if(err && err.type === 'unavailable-id' && attempt < 6){
      peer.destroy();
      tryCreateHostPeer(attempt + 1);
    } else {
      console.error('Peer error (host):', err);
    }
  });
}

function setupHostConnection(conn){
  conn.on('open', () => {
    // Send the current state right away so a joining screen can show
    // real team names / settings before the player actually joins.
    conn.send({ type:'state', state: stateForSend(), categories: publicCategories() });
  });
  conn.on('data', (msg) => handleHostMessage(conn, msg));
  conn.on('close', () => { delete App.connections[conn.peer]; render(); });
}

function sanitizeText(val, maxLen){
  if(typeof val !== 'string') return '';
  return val.trim().slice(0, maxLen);
}

function handleHostMessage(conn, msg){
  if(!msg || !msg.type) return;

  // "I've got the timer sound" — handled before the flood guard so it can
  // never cause a buzz arriving right after it to be ignored.
  if(msg.type === 'sound-ack'){
    if(App.connections[conn.peer] && typeof msg.id === 'string'){ App.soundAcks[conn.peer] = msg.id; render(); }
    return;
  }

  // Basic per-connection flood guard: ignore messages arriving faster than
  // 150ms apart from the same peer, regardless of message type.
  const now = Date.now();
  if(conn._lastMsgAt && now - conn._lastMsgAt < 150) return;
  conn._lastMsgAt = now;

  if(msg.type === 'join'){
    const name = sanitizeText(msg.name, 40) || 'Player';
    const role = (msg.role === 'spectator') ? 'spectator' : 'player';
    const validTeamIds = App.state.teams.map(t => t.id);
    const teamId = (role === 'player' && validTeamIds.indexOf(msg.teamId) !== -1) ? msg.teamId : null;
    App.connections[conn.peer] = { conn, name, teamId, role, score: 0, outdated: msg.v !== APP_VERSION };
    render();
    broadcastState();
    queueSoundFor(conn.peer);
    return;
  }

  const p = App.connections[conn.peer];
  if(!p || p.role === 'spectator') return; // spectators can't buzz or answer

  if(msg.type === 'buzz'){
    const s = App.state;
    if(!s.currentClueId || s.revealed || s.isDailyDouble || s.mode !== 'buzzer') return;
    // Locked buzzers really are locked: nothing counts until the host unlocks.
    if(!s.buzzOpen && !App.buzzRoundActive) return;
    if(s.lockedOut.indexOf(conn.peer) !== -1) return;
    if(App.buzzList.some(b => b.pid === conn.peer)) return;
    // Only the first buzz after the buzzers open makes the buzz-in sound for
    // players; anyone who buzzes right after is just queued quietly.
    const firstBuzzOfRound = s.buzzOpen;
    App.buzzList.push({ pid: conn.peer, name: p.name, teamId: p.teamId });
    if(firstBuzzOfRound) broadcastSfx('buzz');
    if(s.buzzOpen && activeAnswerer()){
      s.buzzOpen = false; // first-in locks the floor
    }
    s.buzzOrderSummary = App.buzzList.map(b => ({ pid:b.pid, name:b.name, teamId:b.teamId }));
    syncBuzzTimer();
    sfxBuzz();
    broadcastState();
    render();
  } else if(msg.type === 'answer'){
    if(!App.state.currentClueId || App.state.revealed) return;
    if(!App.state.submitOpen && Date.now() > App.submitGraceUntil) return;
    if(App.answerList.some(a => a.pid === conn.peer)) return;
    const text = sanitizeText(msg.text, 300);
    if(!text) return;
    App.answerList.push({ pid: conn.peer, name: p.name, teamId: p.teamId, text });
    App.state.answerOrderSummary = App.answerList.map(a => ({ pid:a.pid, name:a.name, teamId:a.teamId, text:a.text }));
    broadcastState();
    render();
  }
}

// Devices' clocks never agree exactly, so instead of sending "the timer ends
// at 9:14:32", the host sends "X ms remain" and each device counts down locally.
function stateForSend(){
  const s = App.state;
  s.timerRemainingMs = s.timerRunning ? Math.max(0, App.timerLocalEnd - Date.now()) : 0;
  const clue = s.currentClueId ? findClue(s.currentCatId, s.currentClueId) : null;
  // During a Daily Double, the clue stays hidden from players until the wager is in.
  const showClue = clue && (!s.isDailyDouble || s.ddPhase === 'clue');
  s.clueData = showClue ? { clue: clue.clue, media: clue.media, value: clue.value } : null;
  s.answerData = (clue && s.revealed) ? clue.answer : null;
  s.appVersion = APP_VERSION;
  s.soundId = (App.timerSoundEnabled && App.timerSound && App.timerSoundId) ? App.timerSoundId : null;
  s.soundVolume = App.timerSoundVolume;
  return s;
}

function broadcastState(){
  const payload = { type:'state', state: stateForSend(), categories: publicCategories() };
  Object.keys(App.connections).forEach(pid => {
    const c = App.connections[pid];
    if(c.conn && c.conn.open) c.conn.send(payload);
  });
}

/* ---------- Answer timer (host is the source of truth) ---------- */
function startTimer(label){
  if(!App.timerEnabled) return;
  const ms = App.timerSeconds * 1000;
  App.timerLocalEnd = Date.now() + ms;
  const s = App.state;
  s.timerRunning = true;
  s.timerExpired = false;
  s.timerTotalMs = ms;
  s.timerFor = label || '';
  s.timerSeq = (s.timerSeq || 0) + 1;   // lets players tell a restart apart from an update
  playTimerSound();
}

function stopTimer(){
  const s = App.state;
  s.timerRunning = false;
  s.timerExpired = false;
  s.timerFor = '';
  App.timerForPid = null;
  stopTimerSound();
}

function onTimerExpired(){
  const s = App.state;
  s.timerRunning = false;
  s.timerExpired = true;
  if(s.mode === 'type' && !s.isDailyDouble && s.submitOpen){
    s.submitOpen = false; // time's up — close the answer box for everyone
    App.submitGraceUntil = Date.now() + 1500;
  }
  stopTimerSound();
  sfxTimeUp();
  broadcastState();
  render();
}

// The person currently "on the clock" in buzzer mode: first in line who
// hasn't already been marked wrong.
function activeAnswerer(){
  const s = App.state;
  return App.buzzList.find(b => s.lockedOut.indexOf(b.pid) === -1 && App.judged[b.pid] !== 'correct') || null;
}

// Keep the timer pointed at whoever's up in buzzer mode.
function syncBuzzTimer(){
  const s = App.state;
  if(!s.currentClueId || s.isDailyDouble || s.mode !== 'buzzer' || s.revealed) return;
  const active = activeAnswerer();
  if(!active){
    if(s.timerRunning || s.timerExpired) stopTimer();
    return;
  }
  if(App.timerEnabled && App.timerForPid !== active.pid){
    startTimer(active.name);
    App.timerForPid = active.pid;
  }
}

function hostStartTimer(){
  const s = App.state;
  let label = 'Everyone';
  if(s.isDailyDouble){
    label = s.ddAnswerer ? s.ddAnswerer.label : '';
  } else if(s.mode === 'buzzer'){
    const a = activeAnswerer();
    if(!a) return;
    label = a.name;
    App.timerForPid = a.pid;
  } else if(!s.submitOpen){
    s.submitOpen = true; // restarting the clock in type mode reopens the answer box
  }
  startTimer(label);
  broadcastState();
  render();
}

function hostOpenClue(catId, clueId){
  const isDD = App.dailyDoubleClueIds.indexOf(clueId) !== -1;
  const startLocked = App.lockOnOpen;
  App.state.currentCatId = catId;
  App.state.currentClueId = clueId;
  App.state.revealed = false;
  App.state.lockedOut = [];
  App.state.buzzOrderSummary = [];
  App.state.answerOrderSummary = [];
  App.state.correctNames = [];
  App.state.isDailyDouble = isDD;
  App.state.ddPhase = isDD ? 'select-answerer' : null;
  App.state.ddAnswerer = null;
  App.state.ddWager = null;
  App.state.buzzOpen = !isDD && App.state.mode === 'buzzer' && !startLocked;
  App.state.submitOpen = !isDD && App.state.mode === 'type' && !startLocked;
  App.buzzRoundActive = App.state.buzzOpen;
  App.buzzList = [];
  App.answerList = [];
  App.judged = {};
  stopTimer();
  if(App.state.submitOpen) startTimer('Everyone');
  broadcastState();
  render();
}

function hostSetDailyDoubleAnswerer(type, id, label){
  App.state.ddAnswerer = { type, id, label };
  App.state.ddPhase = 'wager';
  broadcastState();
  render();
}

function hostConfirmWager(amount){
  App.state.ddWager = amount;
  App.state.ddPhase = 'clue';
  // With "lock until I unlock" on, the Daily Double clock waits for the host
  // to finish reading and press Start Timer; otherwise it starts right away.
  if(!App.lockOnOpen) startTimer(App.state.ddAnswerer ? App.state.ddAnswerer.label : '');
  broadcastState();
  render();
}

function hostToggleMode(){
  if(App.state.currentClueId) return; // don't switch mid-clue
  App.state.mode = App.state.mode === 'buzzer' ? 'type' : 'buzzer';
  broadcastState();
  render();
}

function hostToggleAllowNoTeam(){
  App.state.allowNoTeam = !App.state.allowNoTeam;
  broadcastState();
  render();
}

function hostToggleBuzzOpen(){
  App.state.buzzOpen = !App.state.buzzOpen;
  App.buzzRoundActive = App.state.buzzOpen;
  broadcastState();
  render();
}

function hostToggleSubmitOpen(){
  App.state.submitOpen = !App.state.submitOpen;
  if(App.state.submitOpen){
    startTimer('Everyone');
  } else {
    App.submitGraceUntil = Date.now() + 1500;
    stopTimer();
  }
  broadcastState();
  render();
}

// Shows the answer to everyone and shuts the clue down for responses.
function revealAndWrapUp(){
  const s = App.state;
  s.revealed = true;
  s.buzzOpen = false;
  s.submitOpen = false;
  App.buzzRoundActive = false;
  stopTimer();
}

function hostReveal(){
  revealAndWrapUp();
  broadcastState();
  render();
}

function applyAward(pid, teamId, delta){
  if(teamId){
    const team = App.state.teams.find(t => t.id === teamId);
    if(team) team.score += delta;
  } else if(pid && App.connections[pid]){
    // Player with no team — track their points individually so it isn't lost.
    App.connections[pid].score = (App.connections[pid].score || 0) + delta;
  }
}

function hostAward(pid, teamId, delta){
  applyAward(pid, teamId, delta);
  broadcastState();
  render();
}

function correctLabel(name, teamId){
  return teamId ? `${name} (${teamName(teamId)})` : name;
}

// "Correct" now awards the points AND reveals the answer to everyone. The clue
// stays on screen until the host clicks "Back to Board".
function hostMarkCorrect(pid, teamId, value, name){
  if(App.judged[pid]) return;
  sfxCorrect(); broadcastSfx('correct');
  applyAward(pid, teamId, value);
  App.judged[pid] = 'correct';
  App.state.correctNames.push(correctLabel(name, teamId));
  revealAndWrapUp();
  broadcastState();
  render();
}

function hostMarkWrong(pid, teamId, value){
  if(App.judged[pid]) return;
  const s = App.state;
  sfxWrong(); broadcastSfx('wrong');
  applyAward(pid, teamId, -value);
  App.judged[pid] = 'wrong';
  if(s.lockedOut.indexOf(pid) === -1) s.lockedOut.push(pid);
  if(s.mode === 'buzzer' && !s.revealed){
    // If someone else already buzzed, they're up next; otherwise reopen the floor.
    s.buzzOpen = !activeAnswerer();
    App.buzzRoundActive = true;
    stopTimer();
    syncBuzzTimer();
  }
  broadcastState();
  render();
}

function hostJudgeDailyDouble(correct){
  const s = App.state;
  if(App.judged.__dd) return;
  const pid = s.ddAnswerer.type === 'individual' ? s.ddAnswerer.id : null;
  const teamId = s.ddAnswerer.type === 'team' ? s.ddAnswerer.id : null;
  App.judged.__dd = correct ? 'correct' : 'wrong';
  if(correct){
    sfxCorrect(); broadcastSfx('correct');
    applyAward(pid, teamId, s.ddWager);
    s.correctNames.push(s.ddAnswerer.label);
  } else {
    sfxWrong(); broadcastSfx('wrong');
    applyAward(pid, teamId, -s.ddWager);
  }
  revealAndWrapUp();
  broadcastState();
  render();
}

const STORE_KEYS = {
  board: 'gameNight.board.v1',
  soundOn: 'gameNight.timerSound.on',
  soundVol: 'gameNight.timerSound.volume',
};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); return true; }catch(e){ return false; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

// Bigger files (the sound) go in IndexedDB, which can hold more than localStorage.
function idbOpen(){
  return new Promise(resolve => {
    try{
      const req = indexedDB.open('gameNight', 1);
      req.onupgradeneeded = () => { try{ req.result.createObjectStore('files'); }catch(e){} };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    }catch(e){ resolve(null); }
  });
}
async function idbPut(key, val){
  const db = await idbOpen(); if(!db) return false;
  return new Promise(resolve => {
    try{
      const tx = db.transaction('files', 'readwrite');
      tx.objectStore('files').put(val, key);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
      tx.onabort = () => resolve(false);
    }catch(e){ resolve(false); }
  });
}
async function idbGet(key){
  const db = await idbOpen(); if(!db) return null;
  return new Promise(resolve => {
    try{
      const req = db.transaction('files', 'readonly').objectStore('files').get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    }catch(e){ resolve(null); }
  });
}
async function idbDel(key){
  const db = await idbOpen(); if(!db) return;
  try{ db.transaction('files', 'readwrite').objectStore('files').delete(key); }catch(e){}
}

// One hidden file picker per purpose, kept outside the app area so screen
// refreshes (someone joining, a buzz) can't interrupt choosing a file.
function pickFile(id, accept, onFile){
  let input = document.getElementById(id);
  if(!input){
    input = document.createElement('input');
    input.type = 'file';
    input.id = id;
    input.style.display = 'none';
    document.body.appendChild(input);
  }
  input.accept = accept;
  input.value = '';
  input.onchange = () => { const f = input.files && input.files[0]; if(f) onFile(f); };
  input.click();
}

const timerAudio = new Audio();
timerAudio.preload = 'auto';
timerAudio.addEventListener('ended', () => {

function setTimerSoundSource(name, blob){

/* ---------- Sharing the timer sound with players ----------
   The host's computer sends the sound file to each player/spectator once
   (when it's uploaded, and when someone joins), in small pieces, a few
   people at a time, so buzzes and screen updates never wait behind it. */
const SOUND_CHUNK_BYTES = 11000;   // small enough to travel as one message
const SOUND_SEND_AT_ONCE = 3;      // how many people receive it at the same time

function toBase64(bytes){
  let bin = '';
  for(let i = 0; i < bytes.length; i += 4096) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 4096));
  return btoa(bin);
}

async function prepareSoundForSharing(blob){
  const id = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  App.timerSoundId = null;          // not shareable until the pieces are ready
  App.soundChunks = null;
  App.soundAcks = {};
  App.soundQueue = [];
  const bytes = new Uint8Array(await blob.arrayBuffer());
  const chunks = [];
  for(let i = 0; i < bytes.length; i += SOUND_CHUNK_BYTES) chunks.push(toBase64(bytes.subarray(i, i + SOUND_CHUNK_BYTES)));
  App.timerSoundId = id;
  App.soundChunks = chunks;
  App.soundMime = blob.type || 'audio/mpeg';
  if(App.state && App.view === 'host-board'){
    queueSoundForEveryone();
    broadcastState();
    render();
  }
}

function queueSoundFor(pid){
  if(!App.timerSoundId || !App.soundChunks) return;
  if(App.soundAcks[pid] === App.timerSoundId) return;     // already has it
  if(App.soundQueue.indexOf(pid) !== -1) return;
  App.soundQueue.push(pid);
  pumpSoundQueue();
}
function queueSoundForEveryone(){ Object.keys(App.connections).forEach(queueSoundFor); }

function pumpSoundQueue(){
  while((App.soundSending || 0) < SOUND_SEND_AT_ONCE && App.soundQueue.length){
    const pid = App.soundQueue.shift();
    App.soundSending = (App.soundSending || 0) + 1;
    sendSoundTo(pid).catch(() => {}).finally(() => { App.soundSending--; pumpSoundQueue(); });
  }
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// Waits until this player's connection has room, so game messages to them
// (unlock, timer, reveal) never get stuck behind a pile of sound pieces.
async function waitForRoom(conn){
  for(let tries = 0; tries < 2400; tries++){
    if(!conn.open) return false;
    const dc = conn.dataChannel;
    const waiting = (dc && dc.bufferedAmount) || 0;
    const peerjsBuffer = conn.bufferSize || 0;
    if(waiting < 48 * 1024 && peerjsBuffer === 0) return true;
    await sleep(25);
  }
  return false;
}

async function sendSoundTo(pid){
  const id = App.timerSoundId, chunks = App.soundChunks;
  const c = App.connections[pid];
  if(!id || !chunks || !c || !c.conn || !c.conn.open) return;
  const conn = c.conn;
  conn.send({ type: 'sound-start', id, mime: App.soundMime, count: chunks.length });
  for(let i = 0; i < chunks.length; i++){
    if(App.timerSoundId !== id || !App.connections[pid]) return;   // replaced, or they left
    if(!(await waitForRoom(conn))) return;
    conn.send({ type: 'sound-chunk', id, i, data: chunks[i] });
    if(i % 8 === 7) await sleep(0);
  }
}

function soundShareStatus(){
  if(!App.timerSound) return '';
  const pids = Object.keys(App.connections);
  if(!pids.length) return 'Players will get the sound automatically when they join.';
  if(!App.timerSoundId) return 'Getting the sound ready to send&hellip;';
  const have = pids.filter(pid => App.soundAcks[pid] === App.timerSoundId).length;
  if(have === pids.length) return `&#10003; Everyone in the room has the sound (${have}).`;
  return `Sending the sound to players&hellip; ${have} of ${pids.length} have it so far.`;
}

// Some browsers (Safari especially) only allow sound that starts from a click.

/* ============================================================
   QUESTIONS FROM A SPREADSHEET
   Column A = category, B = question, C = answer,
   D (optional) = picture/video file. Dollar amounts are given
   in order down each category: $200, $400, $600...
   ============================================================ */

// ---- .xlsx reader (an .xlsx file is a zip folder of XML files) ----
async function unzipEntries(buf){
  const dv = new DataView(buf);
  const bytes = new Uint8Array(buf);
  let eocd = -1;
  for(let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 65557); i--){
    if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
  }
  if(eocd < 0) throw new Error('not-zip');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const dec = new TextDecoder();
  const entries = {};
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const compSize = dv.getUint32(p + 20, true);
    const nameLen = dv.getUint16(p + 28, true);
    const extraLen = dv.getUint16(p + 30, true);
    const commentLen = dv.getUint16(p + 32, true);
    const localOff = dv.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, compSize, localOff };
    p += 46 + nameLen + extraLen + commentLen;
  }
  async function read(name){
    const e = entries[name];
    if(!e) return null;
    const ln = dv.getUint16(e.localOff + 26, true);
    const le = dv.getUint16(e.localOff + 28, true);
    const start = e.localOff + 30 + ln + le;
    const data = bytes.slice(start, start + e.compSize);
    if(e.method === 0) return dec.decode(data);
    if(e.method !== 8) throw new Error('unsupported-zip');
    if(typeof DecompressionStream === 'undefined') throw new Error('no-decompress');
    const stream = new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return dec.decode(await new Response(stream).arrayBuffer());
  }
  return { names: Object.keys(entries), read };
}

function xmlDoc(text){ return new DOMParser().parseFromString(text, 'application/xml'); }
function byTag(node, tag){ return Array.from(node.getElementsByTagNameNS('*', tag)); }
function colIndex(ref){
  const letters = (ref.match(/^[A-Z]+/i) || [''])[0].toUpperCase();
  let n = 0;
  for(const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n - 1;
}
function richText(node){
  // All <t> pieces, skipping phonetic hints (<rPh>) some spreadsheets add.
  return decodeExcelEscapes(byTag(node, 't').filter(t => !t.parentNode || t.parentNode.localName !== 'rPh').map(t => t.textContent).join(''));
}
// Excel writes some characters as codes, e.g. a line break as _x000D_ or _x000A_.
function decodeExcelEscapes(t){
  return t.replace(/_x([0-9A-Fa-f]{4})_/g, (m, hex) => String.fromCharCode(parseInt(hex, 16)));
}

async function readXlsxRows(buf){
  const zip = await unzipEntries(buf);
  let sheetPath = null;
  const wbText = await zip.read('xl/workbook.xml');
  const relsText = await zip.read('xl/_rels/workbook.xml.rels');
  if(wbText && relsText){
    const first = byTag(xmlDoc(wbText), 'sheet')[0];
    const rid = first ? (first.getAttribute('r:id') || first.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id')) : null;
    const rel = byTag(xmlDoc(relsText), 'Relationship').find(r => r.getAttribute('Id') === rid);
    if(rel){
      const t = rel.getAttribute('Target');
      sheetPath = t.startsWith('/') ? t.slice(1) : 'xl/' + t.replace(/^\.\//, '');
    }
  }
  if(!sheetPath || zip.names.indexOf(sheetPath) === -1){
    sheetPath = zip.names.filter(n => /^xl\/worksheets\/[^/]+\.xml$/.test(n)).sort()[0];
  }
  if(!sheetPath) throw new Error('no-sheet');
  const sstText = await zip.read('xl/sharedStrings.xml');
  const shared = sstText ? byTag(xmlDoc(sstText), 'si').map(richText) : [];
  const sheet = xmlDoc(await zip.read(sheetPath));
  const rows = [];
  byTag(sheet, 'row').forEach((rowEl, ri) => {
    const rIdx = rowEl.getAttribute('r') ? parseInt(rowEl.getAttribute('r'), 10) - 1 : ri;
    const row = rows[rIdx] = [];
    byTag(rowEl, 'c').forEach((c, ci) => {
      const ref = c.getAttribute('r');
      const cIdx = ref ? colIndex(ref) : ci;
      const type = c.getAttribute('t');
      const v = byTag(c, 'v')[0];
      let val = '';
      if(type === 's') val = v ? (shared[parseInt(v.textContent, 10)] || '') : '';
      else if(type === 'inlineStr'){ const is = byTag(c, 'is')[0]; val = is ? richText(is) : ''; }
      else if(type === 'b') val = v ? (v.textContent === '1' ? 'TRUE' : 'FALSE') : '';
      else val = v ? v.textContent : '';
      row[cIdx] = val;
    });
  });
  for(let i = 0; i < rows.length; i++) if(!rows[i]) rows[i] = [];
  return rows;
}

// ---- .csv reader ----
function parseCsv(text){
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = { ',': (firstLine.match(/,/g) || []).length, ';': (firstLine.match(/;/g) || []).length, '\t': (firstLine.match(/\t/g) || []).length };
  const delim = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const ch = text[i];
    if(inQuotes){
      if(ch === '"'){
        if(text[i + 1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else if(ch === '"') inQuotes = true;
    else if(ch === delim){ row.push(field); field = ''; }
    else if(ch === '\n' || ch === '\r'){
      if(ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function decodeText(buf){
  const utf = new TextDecoder('utf-8').decode(buf);
  if(utf.indexOf('�') === -1) return utf;
  try{ return new TextDecoder('windows-1252').decode(buf); }catch(e){ return utf; }
}

// ---- turning rows into a board ----
const VIDEO_EXT = /\.(mp4|webm|mov|m4v|ogv)$/i;
const IMAGE_EXT = /\.(jpe?g|png|gif|webp|svg|avif)$/i;

function parseMediaCell(raw){
  let path = raw.trim();
  const isUrl = /^https?:\/\//i.test(path);
  if(!isUrl){
    path = path.replace(/^\.?\//, '');
    if(path.indexOf('/') === -1) path = 'media/' + path;   // just a file name → it's in the media folder
  }
  const bare = path.split(/[?#]/)[0];
  const type = VIDEO_EXT.test(bare) ? 'video' : IMAGE_EXT.test(bare) ? 'image' : null;
  if(!type) return null;
  const url = /%[0-9A-Fa-f]{2}/.test(path) ? path : encodeURI(path);
  return { type, url };
}

function cleanCell(v){ return String(v == null ? '' : v).replace(/\r\n?/g, '\n').trim(); }

function buildBoardFromRows(rows){
  const errors = [], warnings = [];
  const groups = [], byName = {};
  let lastCat = '';
  let seenFirst = false;
  rows.forEach((row, i) => {
    const rowNum = i + 1;
    const [cat0, q, a, m] = [0, 1, 2, 3].map(k => cleanCell(row[k]));
    if(!cat0 && !q && !a && !m) return;
    if(!seenFirst){
      seenFirst = true;
      const looksLikeHeader = /^categor(y|ies)$/i.test(cat0) || /^(question|questions|clue|clues|question\s*\/\s*clue)$/i.test(q);
      if(looksLikeHeader) return;
    }
    const cat = cat0 || lastCat;           // a blank category means "same as the row above"
    if(!cat){ errors.push(`Row ${rowNum}: no category in column A.`); return; }
    lastCat = cat;
    let media = null;
    if(m){
      media = parseMediaCell(m);
      if(!media) errors.push(`Row ${rowNum}: can't tell what kind of file "${m}" is. Use a file ending in .mp4, .jpg, .png or .gif (Google Drive / YouTube links won't work).`);
    }
    if(!q && !m) errors.push(`Row ${rowNum}: no question in column B.`);
    if(!a) errors.push(`Row ${rowNum}: no answer in column C.`);
    const key = cat.toLowerCase();
    if(!byName[key]){ byName[key] = { name: cat, items: [] }; groups.push(byName[key]); }
    byName[key].items.push({ q, a, media });
  });

  if(!groups.length) errors.push('No questions found. Put the category in column A, the question in column B and the answer in column C.');
  if(groups.length > 8) errors.push(`There are ${groups.length} categories. The board fits at most 8.`);
  groups.forEach(g => { if(g.items.length > 10) errors.push(`"${g.name}" has ${g.items.length} questions. The most a category can have is 10.`); });
  const counts = groups.map(g => g.items.length);
  if(counts.length && Math.min(...counts) !== Math.max(...counts)){
    warnings.push('Not every category has the same number of questions (' + groups.map(g => `${g.name}: ${g.items.length}`).join(', ') + '). The board will have some empty spaces.');
  }

  const categories = groups.map((g, ci) => ({
    id: 'u' + ci,
    name: g.name,
    clues: g.items.map((it, qi) => makeClue(`u${ci}_${qi}`, (qi + 1) * 200, it.q, it.a, it.media)),
  }));
  return { categories, errors, warnings };
}

function hostUploadBoard(){
  pickFile('pick-board', '.xlsx,.csv,.tsv,.txt', async (file) => {
    App.boardImportBusy = true;
    App.boardImport = null;
    render();
    let result;
    try{
      const buf = await file.arrayBuffer();
      let rows;
      if(/\.xlsx$/i.test(file.name)) rows = await readXlsxRows(buf);
      else if(/\.(csv|tsv|txt)$/i.test(file.name)) rows = parseCsv(decodeText(buf));
      else throw new Error('type');
      result = buildBoardFromRows(rows);
    }catch(err){
      console.error('Spreadsheet error:', err);
      const msg = (err && err.message === 'no-decompress')
        ? 'This browser can’t open .xlsx files. Save the spreadsheet as CSV and upload that instead, or use Chrome.'
        : 'Couldn’t read that file. Please upload an Excel (.xlsx) or CSV file. In Google Sheets: File → Download → Microsoft Excel (.xlsx) or CSV.';
      result = { categories: [], errors: [msg], warnings: [] };
    }
    App.boardImportBusy = false;
    App.boardImport = Object.assign({ fileName: file.name }, result);
    render();
  });
}

function loadSavedBoard(){
  try{
    const raw = lsGet(STORE_KEYS.board);
    if(!raw) return;
    const b = JSON.parse(raw);

function hostDownloadBoard(){

  const csv = '﻿' + lines.map(r => r.map(csvCell).join(',')).join('\r\n');

function playerConnect(){
  App.joinError = '';
  const code = (App.joinRoomInput || '').trim().toUpperCase();
  const name = (App.joinNameInput || '').trim();
  if(!code || code.length < 4){ App.joinError = 'Enter the 4-letter room code.'; render(); return; }
  if(!name){ App.joinError = 'Enter your name.'; render(); return; }
  App.playerName = name;
  App.joinPhase = 'connecting';
  render();

  const peer = new Peer();
  App.peer = peer;
  peer.on('disconnected', () => { try{ peer.reconnect(); }catch(e){} });

  peer.on('open', () => {
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true });
    App.hostConn = conn;
    let settled = false;
    const failTimer = setTimeout(() => {
      if(!settled){
        settled = true;
        App.joinPhase = 'enter-info';
        App.joinError = "Couldn't reach a game with that room code.";
        render();
      }
    }, 8000);
    conn.on('open', () => { settled = true; clearTimeout(failTimer); App.roomCode = code; });
    conn.on('data', (msg) => handlePlayerMessage(msg));
    conn.on('close', () => { App.joinError = 'Lost connection to the host.'; render(); });
    conn.on('error', () => {
      if(!settled){
        settled = true; clearTimeout(failTimer);
        App.joinPhase = 'enter-info';
        App.joinError = "Couldn't reach a game with that room code.";
        render();
      }
    });
  });
  peer.on('error', (err) => {
    if(err && err.type === 'peer-unavailable'){
      App.joinPhase = 'enter-info';
      App.joinError = "Couldn't find a game with that room code.";
      render();
    } else {
      console.error('Peer error (player):', err);
    }
  });
}

/* ---------- Player: receiving and playing the timer sound ---------- */
const playerAudio = new Audio();
playerAudio.preload = 'auto';

// A tiny silent sound used to "unlock" audio while the player is tapping
// (phones only allow sound that starts from a tap; once unlocked, the
// game can play the timer sound later on its own).
function silentWavUrl(){
  const n = 400, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, str) => { for(let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 16000, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, 'data'); v.setUint32(40, n * 2, true);
  return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
}

function unlockPlayerAudio(){
  if(App.audioUnlocked || App.view === 'host-board' || App.view === 'host-login') return;
  if(!playerAudio.paused) return;
  App.audioUnlocked = true;
  try{
    if(!playerAudio.getAttribute('src')) playerAudio.src = silentWavUrl();
    playerAudio.muted = true;
    const p = playerAudio.play();
    const done = () => { if(App.playingSeq == null){ playerAudio.pause(); try{ playerAudio.currentTime = 0; }catch(e){} } playerAudio.muted = !!App.playerMuted; };
    if(p && p.then) p.then(done, () => { playerAudio.muted = !!App.playerMuted; App.audioUnlocked = false; }); else done();
  }catch(e){ playerAudio.muted = !!App.playerMuted; App.audioUnlocked = false; }
}
document.addEventListener('pointerdown', () => {
  if(App.view !== 'player-play' && App.view !== 'player-join') return;
  if(App.soundBlocked){
    App.soundBlocked = false;
    App.playingSeq = null;
    syncPlayerSound(App.state);
    render();
    return;
  }
  unlockPlayerAudio();
}, true);

function togglePlayerMute(){
  App.playerMuted = !App.playerMuted;
  lsSet('gameNight.playerMuted', App.playerMuted ? '1' : '0');
  playerAudio.muted = App.playerMuted;
  if(App.playerMuted) App.soundBlocked = false;
  render();
}

function stopPlayerSound(){
  App.playingSeq = null;
  try{ if(!playerAudio.paused) playerAudio.pause(); }catch(e){}
}

// Start/stop the player's copy of the sound to match the host's timer.
function syncPlayerSound(s){
  const ready = s && s.timerRunning && s.soundId && App.playerSound && App.playerSound.id === s.soundId;
  if(!ready){ stopPlayerSound(); if(App.soundBlocked && !(s && s.timerRunning)){ App.soundBlocked = false; } return; }
  try{ playerAudio.volume = (typeof s.soundVolume === 'number') ? s.soundVolume : 0.8; }catch(e){}
  if(App.playingSeq === s.timerSeq) return;           // already playing for this countdown
  App.playingSeq = s.timerSeq;
  if(playerAudio.getAttribute('src') !== App.playerSound.url) playerAudio.src = App.playerSound.url;
  // Start at the right spot (e.g. someone who joins halfway through a countdown).
  const elapsed = Math.max(0, (s.timerTotalMs || 0) - Math.max(0, App.timerLocalEnd - Date.now())) / 1000;
  const seek = () => { try{ playerAudio.currentTime = elapsed < 0.4 ? 0 : elapsed; }catch(e){} };
  if(playerAudio.readyState >= 1) seek(); else playerAudio.addEventListener('loadedmetadata', seek, { once: true });
  playerAudio.muted = !!App.playerMuted;   // muted players stay in sync silently, so unmuting picks right up
  const p = playerAudio.play();
  if(p && p.catch) p.catch((err) => {
    if(err && err.name === 'NotAllowedError' && !App.playerMuted){ App.soundBlocked = true; App.playingSeq = null; render(); }
  });
}

function receiveSoundPiece(msg){
  if(msg.type === 'sound-start'){
    if(typeof msg.id !== 'string' || !(msg.count > 0) || msg.count > 2000) return;
    if(App.playerSound && App.playerSound.id === msg.id){ App.hostConn.send({ type: 'sound-ack', id: msg.id }); return; }
    App.incomingSound = { id: msg.id, mime: (typeof msg.mime === 'string' && /^audio\//.test(msg.mime)) ? msg.mime : 'audio/mpeg', count: msg.count, parts: new Array(msg.count), got: 0 };
    return;
  }
  const inc = App.incomingSound;
  if(!inc || msg.id !== inc.id || typeof msg.data !== 'string') return;
  const i = msg.i;
  if(!(i >= 0 && i < inc.count) || inc.parts[i] != null) return;
  inc.parts[i] = msg.data;
  inc.got++;
  if(inc.got < inc.count) return;
  try{
    const pieces = inc.parts.map(b64 => { const bin = atob(b64); const u = new Uint8Array(bin.length); for(let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k); return u; });
    const url = URL.createObjectURL(new Blob(pieces, { type: inc.mime }));
    const wasPlaying = App.playingSeq != null;
    if(App.playerSound && App.playerSound.url){ try{ URL.revokeObjectURL(App.playerSound.url); }catch(e){} }
    App.playerSound = { id: inc.id, url };
    App.incomingSound = null;
    if(!wasPlaying){ playerAudio.src = url; playerAudio.load(); }
    App.hostConn.send({ type: 'sound-ack', id: inc.id });
    App.playingSeq = null;
    syncPlayerSound(App.state);        // a countdown may already be running
  }catch(e){ console.error('Sound assemble failed', e); App.incomingSound = null; }
}

function handlePlayerMessage(msg){
  if(msg && (msg.type === 'sound-start' || msg.type === 'sound-chunk')){ receiveSoundPiece(msg); return; }
  if(msg && msg.type === 'sfx'){
    if(App.view !== 'player-play') return;
    if(msg.name === 'buzz') sfxBuzz();
    else if(msg.name === 'correct') sfxCorrect();
    else if(msg.name === 'wrong') sfxWrong();
    return;
  }
  if(!msg || msg.type !== 'state') return;
  const s = msg.state;
  const prev = App.state;
  const clueChanged = !prev || prev.currentClueId !== s.currentClueId;

  if(s.timerRunning) App.timerLocalEnd = Date.now() + (s.timerRemainingMs || 0);

  // Little audio cues for players (only once they're in the game, not on the join screen).
  if(App.view === 'player-play' && prev && !clueChanged && s.currentClueId){
    const unlocked = (!prev.buzzOpen && s.buzzOpen && s.mode === 'buzzer' && !(prev.buzzOrderSummary||[]).length) ||
                     (!prev.submitOpen && s.submitOpen && s.mode === 'type');
    if(unlocked) sfxUnlock();
    if(!prev.timerExpired && s.timerExpired) sfxTimeUp();
  }

  App.state = s;
  App.categories = msg.categories || App.categories;
  if(App.view === 'player-play') syncPlayerSound(s);
  if(clueChanged){ App.myBuzzed = false; App.mySubmitted = false; App.answerDraft = ''; }
  // If a buzz didn't count (e.g. it crossed paths with the host locking buzzers),
  // let the player buzz again once things reopen instead of being stuck.
  const myId = App.peer ? App.peer.id : '';
  if(App.myBuzzed && !s.buzzOpen && !(s.buzzOrderSummary || []).some(b => b.pid === myId)) App.myBuzzed = false;
  if(App.joinPhase === 'connecting'){ App.joinPhase = 'picking'; }
  render();
}

function playerConfirmJoin(){
  if(App.playerRole === 'player' && App.state.allowNoTeam === false && !App.playerTeam){
    App.joinError = 'Please choose a team, or spectate instead.';
    render();
    return;
  }
  App.joinError = '';
  App.hostConn.send({
    type: 'join',
    name: App.playerName,
    teamId: App.playerRole === 'spectator' ? null : App.playerTeam,
    role: App.playerRole,
    v: APP_VERSION,
  });
  sfxJoin();
  unlockPlayerAudio();
  App.view = 'player-play';
  render();
}

function playerBuzz(){
  if(App.myBuzzed) return;
  App.myBuzzed = true;
  render();
  App.hostConn.send({ type:'buzz' });
}

function playerSubmitAnswer(){
  if(App.mySubmitted || !App.answerDraft.trim()) return;
  App.mySubmitted = true;
  sfxSubmit();
  render();
  App.hostConn.send({ type:'answer', text: App.answerDraft.trim() });
}

/* ============================================================
   RENDER
   ============================================================ */
function el(html){ const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

function render(){
  const root = document.getElementById('app');

  // Re-rendering rebuilds the DOM from scratch, which would otherwise kick
  // focus out of whatever input someone is typing in. Capture it here and
  // restore it after, so typing survives a re-render.
  const active = document.activeElement;
  let focusInfo = null;
  if(active && active.id && root.contains(active)){
    focusInfo = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }

  // Hang on to a clue video that's already playing, so a screen refresh
  // (someone buzzes, the timer starts, etc.) doesn't restart it or re-mute it.
  const oldVideo = root.querySelector('.clue-media video');
  const oldVideoWasPlaying = oldVideo ? !oldVideo.paused : false;

  root.innerHTML = '';
  let node;
  try{
    if(App.view === 'landing') node = renderLanding();
    else if(App.view === 'host-login') node = renderHostLogin();
    else if(App.view === 'host-board') node = renderHostBoard();
    else if(App.view === 'player-join') node = renderPlayerJoin();
    else if(App.view === 'player-play') node = renderPlayerPlay();
    else node = renderLanding();
  }catch(err){
    console.error('Render error:', err);
    node = el(`<div class="landing"><div class="panel" style="text-align:center;">
      <div style="font-weight:800;margin-bottom:8px;">Something went wrong showing this screen.</div>
      <div class="hint-text">It'll try again on the next update. If it stays like this, refresh the page and rejoin with the same room code.</div>
    </div></div>`);
  }
  root.appendChild(node);

  const newVideo = root.querySelector('.clue-media video');
  if(oldVideo && newVideo && oldVideo.getAttribute('src') === newVideo.getAttribute('src')){
    newVideo.replaceWith(oldVideo);
    if(oldVideoWasPlaying){ try{ const p = oldVideo.play(); if(p && p.catch) p.catch(() => {}); }catch(e){} }
  }

  if(focusInfo){
    const restored = document.getElementById(focusInfo.id);
    if(restored){
      restored.focus();
      if(typeof restored.setSelectionRange === 'function' && focusInfo.start != null){
        try{ restored.setSelectionRange(focusInfo.start, focusInfo.end); }catch(e){}
      }
    }
  }
}

/* ---------- Timer display ---------- */
function timerHtml(){
  const s = App.state;
  if(!s || !(s.timerRunning || s.timerExpired)) return '';
  if(s.timerExpired){
    return `<div class="timer-display expired" id="timer-display">
      <div class="timer-label">${escapeHtml(s.timerFor || '')}</div>
      <div class="timer-count" id="timer-count">TIME'S UP!</div>
    </div>`;
  }
  const remaining = Math.max(0, App.timerLocalEnd - Date.now());
  const secs = Math.ceil(remaining / 1000);
  const pct = s.timerTotalMs ? Math.min(100, (remaining / s.timerTotalMs) * 100) : 0;
  return `<div class="timer-display ${secs <= 5 ? 'low' : ''}" id="timer-display">
    <div class="timer-label">${escapeHtml(s.timerFor ? s.timerFor + "'s time" : 'Time left')}</div>
    <div class="timer-count" id="timer-count">${secs}</div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:${pct}%"></div></div>
  </div>`;
}

// Runs a few times a second. Only touches the timer numbers — never redraws
// the whole screen — so typing and videos aren't interrupted.
function tickTimer(){
  const s = App.state;
  if(!s || !s.timerRunning) return;
  const remaining = Math.max(0, App.timerLocalEnd - Date.now());
  if(App.view === 'host-board' && remaining <= 0){ onTimerExpired(); return; }
  const box = document.getElementById('timer-display');
  const count = document.getElementById('timer-count');
  const fill = document.getElementById('timer-fill');
  if(!box || !count) return;
  const secs = Math.ceil(remaining / 1000);
  count.textContent = String(secs);
  box.classList.toggle('low', secs <= 5);
  if(fill && s.timerTotalMs) fill.style.width = Math.min(100, (remaining / s.timerTotalMs) * 100) + '%';
}
setInterval(tickTimer, 200);

          &middot; Lock ${App.lockOnOpen ? 'on' : 'off'}
          &middot; Timer ${App.timerEnabled ? App.timerSeconds + 's' : 'off'}
        </div>
        <button class="small-btn" id="btn-toggle-roster">Players (${connKeys.length})</button>
        <button class="small-btn" id="btn-toggle-settings">&#9881; Settings</button>
      </div>
    </div>
  `);

  topbar.querySelector('#btn-toggle-settings').onclick = () => { App.settingsPanelOpen = !App.settingsPanelOpen; render(); };
  wrap.appendChild(topbar);
  wrap.appendChild(renderSettingsDrawer());

  const scoreboard = el(`<div class="scoreboard"></div>`);
  s.teams.forEach(t => {
    const pill = el(`
      <div class="team-pill">
        <div class="team-dot" style="background:${t.color}"></div>
        <input value="${escapeHtml(t.name)}" data-team="${t.id}">
        <div class="tscore">${t.score}</div>
      </div>
    `);
    pill.querySelector('input').onchange = (e) => hostRenameTeam(t.id, e.target.value);
    scoreboard.appendChild(pill);
  });
  wrap.appendChild(scoreboard);

  wrap.appendChild(renderRosterDrawer(connKeys, playerCount, spectatorCount));

  if(App.pickingDailyDouble){
    const banner = el(`
      <div class="pick-banner">
        <span>Click tiles to mark them as Daily Doubles (&#9733;). Click again to unmark.</span>
        <button class="small-btn" id="btn-done-picking">Done</button>
      </div>
    `);
    banner.querySelector('#btn-done-picking').onclick = () => { App.pickingDailyDouble = false; render(); };
    wrap.appendChild(banner);
  }

  const boardWrap = el(`<div class="board-wrap"><div class="board"></div></div>`);
  const board = boardWrap.querySelector('.board');
  board.style.gridTemplateColumns = `repeat(${App.categories.length || 6}, 1fr)`;
  App.categories.forEach(cat => {
    board.appendChild(el(`<div class="cat-header">${escapeHtml(cat.name)}</div>`));
  });
  const maxRows = Math.max(...App.categories.map(c => c.clues.length));
  for(let r=0; r<maxRows; r++){
    App.categories.forEach(cat => {
      const clue = cat.clues[r];
      if(!clue){ board.appendChild(el(`<div></div>`)); return; }
      const used = s.usedClues.indexOf(clue.id) !== -1;
      const isDD = App.dailyDoubleClueIds.indexOf(clue.id) !== -1;
      const tile = el(`<div class="clue-tile ${used?'used':''}">${used ? '' : (isDD ? '&#9733; $'+clue.value : '$'+clue.value)}</div>`);
      if(!used){
        tile.onclick = () => {
          if(App.pickingDailyDouble){
            const idx = App.dailyDoubleClueIds.indexOf(clue.id);
            if(idx === -1) App.dailyDoubleClueIds.push(clue.id); else App.dailyDoubleClueIds.splice(idx, 1);
            render();
          } else {
            hostOpenClue(cat.id, clue.id);
          }
        };
      }
      board.appendChild(tile);
    });
  }
  wrap.appendChild(boardWrap);

  if(s.currentClueId){
    wrap.appendChild(renderHostClueOverlay());
  }

  return wrap;
}

function renderRosterDrawer(connKeys, playerCount, spectatorCount){
  const groups = {};
  const noTeamList = [];
  const spectators = [];
  connKeys.forEach(k => {
    const p = App.connections[k];
    const label = p.outdated ? p.name + ' \u26A0 old version, ask them to refresh' : p.name;
    if(p.role === 'spectator'){ spectators.push(label); return; }
    if(p.teamId){
      if(!groups[p.teamId]) groups[p.teamId] = [];
      groups[p.teamId].push(label);
    } else {
      noTeamList.push({ name: label, score: p.score || 0 });
    }
  });

  // Anyone who's scored moves to the top, highest first; everyone still at
  // zero stays below in the order they joined (Array.sort is stable, so a
  // zero-vs-zero comparison leaves their original order untouched).
  noTeamList.sort((a, b) => {
    if(a.score === 0 && b.score === 0) return 0;
    if(a.score === 0) return 1;
    if(b.score === 0) return -1;
    return b.score - a.score;
  });

  const drawer = el(`
    <div class="roster-drawer ${App.rosterPanelOpen ? 'open' : ''}">
      <div class="roster-drawer-header">
        <h3>${playerCount} playing &middot; ${spectatorCount} spectating</h3>
        <button class="small-btn" id="btn-close-roster">Close</button>
      </div>
      <div class="roster-groups" style="flex-direction:column;"></div>
    </div>
  `);
  drawer.querySelector('#btn-close-roster').onclick = () => { App.rosterPanelOpen = false; render(); };
  const groupsWrap = drawer.querySelector('.roster-groups');

  Object.keys(groups).forEach(tid => {
    groupsWrap.appendChild(el(`
      <div class="roster-group">
        <h4>${escapeHtml(teamName(tid))}</h4>
        <ul>${groups[tid].map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
      </div>
    `));
  });
  if(noTeamList.length){
    groupsWrap.appendChild(el(`
      <div class="roster-group">
        <h4>No team</h4>
        <ul>${noTeamList.map(p => `<li>${escapeHtml(p.name)} &mdash; ${p.score} pts</li>`).join('')}</ul>
      </div>
    `));
  }
  if(spectators.length){
    groupsWrap.appendChild(el(`
      <div class="roster-group">
        <h4>Spectating</h4>
        <ul>${spectators.map(n => `<li>${escapeHtml(n)}</li>`).join('')}</ul>
      </div>
    `));
  }
  if(!connKeys.length){
    groupsWrap.appendChild(el(`<div class="feed-empty">Nobody has joined yet.</div>`));
  }
  return drawer;
}

function renderHostClueOverlay(){

  // Response controls (buzzer / answer box). The big gold "Unlock" button

  let responseBtn = '';
  if(!s.isDailyDouble && !s.revealed){
    if(s.mode === 'buzzer'){
      if(s.buzzOpen) responseBtn = `<button class="small-btn" id="btn-toggle-buzz">Lock Buzzers</button>`;

          ${!s.revealed ? `<button class="small-btn" id="btn-reveal">Reveal Answer</button>` : ''}
          ${s.isDailyDouble && !ddJudged ? `
            <button class="small-btn" id="btn-dd-correct" style="background:var(--correct-green);color:#fff;">Correct (+$${s.ddWager})</button>
            <button class="small-btn" id="btn-dd-wrong" style="background:var(--wrong-red);color:#fff;">Wrong (-$${s.ddWager})</button>

  overlay.querySelector('#btn-close-clue').onclick = () => hostCloseClue();

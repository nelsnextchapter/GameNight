    let right;
    if(verdict === 'correct') right = `<span class="judged-badge correct">Correct</span>`;
    else if(verdict === 'wrong' || locked) right = `<span class="judged-badge wrong">Wrong &middot; locked out</span>`;
    else if(s.revealed) right = '';
    else right = `
      <div class="feed-actions">
        <button class="mini-btn correct" data-team="${escapeHtml(b.teamId||'')}" data-value="${clue.value}" data-pid="${escapeHtml(b.pid)}" data-name="${escapeHtml(b.name)}">Correct</button>
        <button class="mini-btn wrong" data-team="${escapeHtml(b.teamId||'')}" data-value="${clue.value}" data-pid="${escapeHtml(b.pid)}">Wrong</button>
      </div>`;
    return `
      <div class="feed-row ${(locked && verdict !== 'correct')?'locked':''}">
        <div class="feed-rank">#${i+1}</div>
        <div class="feed-name">${escapeHtml(b.name)}<div class="feed-team">${escapeHtml(teamName(b.teamId))}</div></div>
        ${right}
      </div>`;
  }).join('')}</div>`;
}

function renderAnswerFeed(){
  const clue = currentClue();
  if(!App.answerList.length) return `<div class="answer-feed"><div class="feed-empty">No answers submitted yet.</div></div>`;
  return `<div class="answer-feed">${App.answerList.map((a,i) => `
    <div class="feed-row">
      <div class="feed-rank">#${i+1}</div>
      <div class="feed-name">${escapeHtml(a.name)}<div class="feed-team">${escapeHtml(teamName(a.teamId))}</div></div>
      <div class="feed-answer-text">${escapeHtml(a.text)}</div>
      ${App.judged[a.pid]
        ? `<span class="judged-badge ${App.judged[a.pid]}">${App.judged[a.pid] === 'correct' ? 'Correct' : 'Wrong'}</span>`
        : `<div class="feed-actions">
            <button class="mini-btn correct" data-team="${escapeHtml(a.teamId||'')}" data-value="${clue.value}" data-pid="${escapeHtml(a.pid)}" data-name="${escapeHtml(a.name)}">Correct</button>
            <button class="mini-btn wrong" data-team="${escapeHtml(a.teamId||'')}" data-value="${clue.value}" data-pid="${escapeHtml(a.pid)}">Wrong</button>
          </div>`}
    </div>`).join('')}</div>`;
}

// Same board the host sees, minus everything host-only (no Daily Double stars,
// no clicking). Picked tiles go blank as the game goes on.
function renderPlayerBoard(){
  const s = App.state;
  const cats = App.categories || [];
  const boardWrap = el(`
    <div class="board-wrap">
      <div class="board-waiting">Waiting for the host to pick a clue&hellip;</div>
      <div class="board readonly"></div>
    </div>
  `);
  const board = boardWrap.querySelector('.board');
  board.style.gridTemplateColumns = `repeat(${cats.length || 6}, 1fr)`;
  cats.forEach(cat => board.appendChild(el(`<div class="cat-header">${escapeHtml(cat.name)}</div>`)));
  const maxRows = cats.length ? Math.max(...cats.map(c => c.clues.length)) : 0;
  for(let r = 0; r < maxRows; r++){
    cats.forEach(cat => {
      const clue = cat.clues[r];
      if(!clue){ board.appendChild(el(`<div></div>`)); return; }
      const used = (s.usedClues || []).indexOf(clue.id) !== -1;
      board.appendChild(el(`<div class="clue-tile ${used ? 'used' : ''}">${used ? '' : '$' + clue.value}</div>`));
    });
  }
  return boardWrap;
}

function renderPlayerPlay(){
  const s = App.state;
  const wrap = el(`<div class="player-wrap"></div>`);
  const myTeam = App.playerTeam;
  const isSpectator = App.playerRole === 'spectator';

  wrap.appendChild(el(`
    <div class="player-status-bar">
      <span>${escapeHtml(App.playerName)} &middot; ${isSpectator ? 'Spectating' : escapeHtml(teamName(myTeam))}</span>
      <span style="display:flex;align-items:center;gap:12px;">
        <button class="small-btn" id="btn-player-mute" title="Turn game sounds on or off on this device">${App.playerMuted ? '&#128263; Sound off' : '&#128266; Sound on'}</button>
        <span>Room ${App.roomCode}</span>
      </span>
    </div>
  `));
  const muteBtn = wrap.querySelector('#btn-player-mute');
  if(muteBtn) muteBtn.onclick = () => togglePlayerMute();
  if(App.soundBlocked){
    wrap.appendChild(el(`<div class="pick-banner" style="cursor:pointer;justify-content:center;">
      <span>&#128263; Tap anywhere to turn on the timer sound</span>
    </div>`));
  }
  if(s.appVersion !== APP_VERSION){
    wrap.appendChild(el(`<div class="pick-banner" style="border-color:rgba(214,69,69,0.6);background:rgba(214,69,69,0.15);">
      <span>The host's game page is out of date. Ask the host to refresh their page (and start a new room) so everyone is on the same version.</span>
    </div>`));
  }

  const scoreboard = el(`<div class="scoreboard"></div>`);
  s.teams.forEach(t => {
    scoreboard.appendChild(el(`
      <div class="team-pill">
        <div class="team-dot" style="background:${t.color}"></div>
        <span class="tname">${escapeHtml(t.name)}</span>
        <div class="tscore">${t.score}</div>
      </div>
    `));
  });
  wrap.appendChild(scoreboard);

  const main = el(`<div class="player-main"></div>`);

  if(!s.currentClueId){
    wrap.appendChild(renderPlayerBoard());
    return wrap;
  } else {
    const clue = currentClue();

    if(s.isDailyDouble && s.ddPhase !== 'clue'){
      main.appendChild(el(`<div class="marquee-title" style="font-size:clamp(24px,6vw,36px);">DAILY DOUBLE!</div>`));
      if(s.ddPhase === 'select-answerer'){
        main.appendChild(el(`<div class="hint-text">Waiting for the host to choose who's answering&hellip;</div>`));
      } else {
        main.appendChild(el(`<div class="hint-text">${escapeHtml(s.ddAnswerer ? s.ddAnswerer.label : '')} is wagering&hellip;</div>`));
      }
      wrap.appendChild(main);
      return wrap;
    }

    if(!clue){
      main.appendChild(el(`<div class="waiting-pulse">Loading the clue&hellip;</div>`));
      wrap.appendChild(main);
      return wrap;
    }

    main.appendChild(el(`<div class="clue-text">${escapeHtml(clue.clue)}</div>`));
    if(clue.media){
      main.appendChild(el(`<div class="clue-media">${clue.media.type==='video' ? `<video src="${clue.media.url}" controls autoplay muted loop></video>` : `<img src="${clue.media.url}">`}</div>`));
    }
    const timerBox = timerHtml();
    if(s.revealed){
      main.appendChild(el(`<div class="answer-reveal">${escapeHtml(clue.answer)}</div>`));
      if(s.correctNames && s.correctNames.length){
        main.appendChild(el(`<div class="correct-by">&#10003; ${s.correctNames.map(escapeHtml).join(', ')}</div>`));
      }
    } else if(timerBox){
      main.appendChild(el(timerBox));
    }

    if(s.revealed){
      // answer already shown above
    } else if(s.isDailyDouble){
      const myId = App.peer ? App.peer.id : '';
      const amAnswerer = s.ddAnswerer && (
        (s.ddAnswerer.type === 'team' && !isSpectator && s.ddAnswerer.id === myTeam) ||
        (s.ddAnswerer.type === 'individual' && s.ddAnswerer.id === myId)
      );
      if(amAnswerer){
        main.appendChild(el(`<div class="buzz-rank-msg">This one's on you! Wager: $${s.ddWager}</div>`));
      } else {
        main.appendChild(el(`<div class="hint-text">Daily Double &mdash; ${escapeHtml(s.ddAnswerer ? s.ddAnswerer.label : '')} is answering for $${s.ddWager}.</div>`));
      }
    } else if(isSpectator){
      const queue = (s.buzzOrderSummary || []).filter(b => s.lockedOut.indexOf(b.pid) === -1);
      let msg;
      if(s.mode === 'buzzer'){
        msg = queue.length ? `Watching — ${escapeHtml(queue[0].name)} is answering.` : (s.buzzOpen ? 'Watching — buzzers are open.' : 'Watching — buzzers are locked.');
      } else {
        msg = s.submitOpen ? 'Watching — answers are open.' : 'Watching — waiting on the host.';
      }
      main.appendChild(el(`<div class="hint-text">${msg}</div>`));
    } else if(s.mode === 'buzzer'){
      const myId = App.peer ? App.peer.id : '';
      const amLocked = s.lockedOut.indexOf(myId) !== -1;
      const queue = (s.buzzOrderSummary || []).filter(b => s.lockedOut.indexOf(b.pid) === -1);
      const myPos = queue.findIndex(b => b.pid === myId);
      if(amLocked){
        main.appendChild(el(`<button class="buzzer-btn" disabled>LOCKED</button>`));
        main.appendChild(el(`<div class="hint-text">Not quite &mdash; you're locked out for this clue.</div>`));
      } else if(myPos !== -1){
        main.appendChild(el(`<div class="buzz-rank-msg">${myPos === 0 ? "You're up &mdash; answer now!" : `You're #${myPos+1} in line &mdash; waiting your turn`}</div>`));
      } else {
        const btn = el(`<button class="buzzer-btn" ${(!s.buzzOpen || App.myBuzzed) ? 'disabled' : ''}>${App.myBuzzed ? 'BUZZED' : 'BUZZ'}</button>`);
        btn.onclick = () => playerBuzz();
        main.appendChild(btn);
        if(!s.buzzOpen){
          const why = queue.length
            ? `${escapeHtml(queue[0].name)} is answering&hellip;`
            : 'Get ready &mdash; buzzers unlock when the host finishes reading.';
          main.appendChild(el(`<div class="hint-text">${why}</div>`));
        }
      }
    } else {
      if(App.mySubmitted){
        main.appendChild(el(`<div class="buzz-rank-msg">Answer submitted &mdash; waiting on the host.</div>`));
      } else if(!s.submitOpen){
        main.appendChild(el(`<div class="hint-text">${s.timerExpired ? "Time's up &mdash; answers are closed." : 'Get ready &mdash; the answer box unlocks when the host finishes reading.'}</div>`));
      } else {
        const box = el(`
          <div class="answer-box">
            <textarea id="answer-textarea" placeholder="Type your answer&hellip;"></textarea>
            <button class="big-btn" id="btn-submit-answer">Submit Answer</button>
          </div>
        `);
        const ta = box.querySelector('textarea');
        ta.value = App.answerDraft;
        ta.oninput = (e) => { App.answerDraft = e.target.value; };
        box.querySelector('#btn-submit-answer').onclick = () => playerSubmitAnswer();
        main.appendChild(box);
      }
    }
  }

  wrap.appendChild(main);
  return wrap;
}

/* ============================================================
   INIT
   ============================================================ */
loadSavedBoard();
loadSavedTimerSound();
render();
</script>
